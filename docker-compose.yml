services:

  db:
    image: mysql:8.0
    container_name: rops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: rops_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: rops-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: rops_db
    ports:
         - "8000:8000"

volumes:
  mysql_data: